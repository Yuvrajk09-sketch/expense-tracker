<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
      <h2 class="text-center mb-4">Reset Password</h2>
      
      <!-- Loading State -->
      <div id="loading-state" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Verifying your link...</p>
      </div>

      <!-- Error Message State -->
      <div id="error-state" class="text-danger text-center mb-3 d-none">
        <h5 id="error-message"></h5>
        <a href="login.html" class="btn btn-outline-primary mt-3">Back to Login</a>
      </div>

      <!-- Success Message State -->
      <div id="success-state" class="text-success text-center mb-3 d-none">
        <h5 id="success-message"></h5>
        <a href="login.html" class="btn btn-primary mt-3 w-100">Go to Login</a>
      </div>

      <!-- Reset Form -->
      <form id="reset-password-form" class="d-none">
        <div class="mb-4">
          <label for="newpassword" class="form-label">New Password</label>
          <input type="password" id="newpassword" class="form-control" placeholder="Enter your new password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
      </form>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="resetpassword.js"></script>
</body>
</html>
