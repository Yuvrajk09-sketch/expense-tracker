<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-center mb-0">Expense Tracker</h2>
            <button id="buy-premium-btn" class="btn btn-warning fw-bold shadow-sm">👑 Buy Premium</button>
        </div>
        
        <div class="card shadow p-4 mb-4">
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="amount" class="form-label">Expense Amount</label>
                        <input type="number" class="form-control" id="amount" required>
                    </div>
                    <div class="col-md-4">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" required>
                    </div>
                    <div class="col-md-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="Food">Food</option>
                            <option value="Petrol">Petrol</option>
                            <option value="Salary">Salary</option>
                            <option value="Electricity">Electricity</option>
                            <option value="Movie">Movie</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100" id="submit-btn">Add Expense</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card shadow p-4">
            <h4>Total Expenses: $<span id="total-expense">0</span></h4> 
            <ul class="list-group mt-3" id="expense-list">
                <!-- Expenses will be appended here -->
            </ul>
        </div>
    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
