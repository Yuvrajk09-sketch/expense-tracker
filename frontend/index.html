<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-center mb-0">Expense Tracker</h2>
            <div>
                <button id="download-expenses-btn" class="btn btn-success fw-bold shadow-sm me-2 d-none">⬇ Download Report</button>
                <button id="buy-premium-btn" class="btn btn-warning fw-bold shadow-sm">👑 Buy Premium</button>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card shadow p-4 h-100">
                    <h5 class="mb-3 text-danger">Add Expense</h5>
                    <form id="expense-form">
                        <input type="hidden" id="expense-id">
                        <div class="mb-2">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="amount" required>
                        </div>
                        <div class="mb-2">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description" required>
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" required>
                                <option value="Food">Food</option>
                                <option value="Petrol">Petrol</option>
                                <option value="Electricity">Electricity</option>
                                <option value="Movie">Movie</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-danger w-100" id="submit-btn">Add Expense</button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card shadow p-4 h-100 border-success">
                    <h5 class="mb-3 text-success">Add Income</h5>
                    <form id="income-form">
                        <input type="hidden" id="income-id">
                        <div class="mb-2">
                            <label for="income-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="income-amount" required>
                        </div>
                        <div class="mb-2">
                            <label for="income-description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="income-description" required>
                        </div>
                        <div class="mb-3">
                            <label for="income-category" class="form-label">Category</label>
                            <select class="form-select" id="income-category" required>
                                <option value="Salary">Salary</option>
                                <option value="Bonus">Bonus</option>
                                <option value="Gift">Gift</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="income-submit-btn">Add Income</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="d-flex justify-content-end align-items-center">
                <div class="d-flex align-items-center">
                    <label for="limit-select" class="form-label me-2 mb-0 text-nowrap">Rows per page:</label>
                    <select id="limit-select" class="form-select form-select-sm w-auto">
                        <option value="5">5</option>
                        <option value="8">8</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="40">40</option>
                    </select>
                </div>
            </div>
            <ul class="list-group mt-3" id="expense-list">
                <!-- Expenses will be appended here -->
            </ul>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="prev-page-btn" class="btn btn-outline-secondary btn-sm" disabled>Previous</button>
                <span id="page-info" class="text-muted small">Page 1</span>
                <button id="next-page-btn" class="btn btn-outline-secondary btn-sm" disabled>Next</button>
            </div>
        </div>

        <!-- Premium Dashboard -->
        <div id="premium-dashboard-section" class="card shadow p-4 mt-4 d-none">
            <h4 class="mb-3 text-warning">👑 Premium Dashboard</h4>
            <div class="d-flex justify-content-end mb-2">
                <button id="load-dashboard-btn" class="btn btn-outline-warning btn-sm">Load Dashboard</button>
            </div>
            
            <h5 class="mt-3">Daily Breakdown</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="daily-table">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Income</th>
                            <th>Expense</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Daily data appended here -->
                    </tbody>
                </table>
            </div>

            <h5 class="mt-4">Monthly/Yearly Summary</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="monthly-table">
                    <thead class="table-dark">
                        <tr>
                            <th>Month</th>
                            <th>Income</th>
                            <th>Expense</th>
                            <th>Savings</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Monthly data appended here -->
                    </tbody>
                </table>
            </div>
        </div>
        <div id="leaderboard-section" class="card shadow p-4 mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 text-warning">👑 Premium Leaderboard</h4>
                <button id="show-leaderboard-btn" class="btn btn-outline-warning btn-sm">Show Leaderboard</button>
            </div>
            <ul class="list-group" id="leaderboard-list">
                <!-- Leaderboard data will be appended here -->
            </ul>
        </div>

        <div id="ai-advisor-section" class="card shadow p-4 mt-4 bg-light border-info">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 text-info">🤖 AI Financial Advisor</h4>
            </div>
            <div class="input-group mb-3">
                <input type="text" id="ai-prompt-input" class="form-control" placeholder="Ask AI anything about your expenses... (e.g., How can I save on food?)">
                <button id="ask-ai-btn" class="btn btn-info text-white">Ask Gemini</button>
            </div>
            <div id="ai-response-box" class="p-3 bg-white rounded border d-none" style="font-style: italic;">
                <!-- AI Response will go here -->
            </div>
        </div>
    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
